</style></head><body><header><div><h1>台灣債券成交利率矩陣</h1><p>等殖 EBTS（平均 Volume-Weighted Average）與處所 OTC（加權平均Volume-Weighted Average）成交利率</p></div><div class="header-actions"><button id="triggerDaily" class="button primary">Update Taiwan bond history</button><button id="triggerIntraday" class="button primary">更新盤中資料</button><button id="reload" class="button secondary">重新載入</button></div></header><main><section class="stats"><div class="stat panel"><span>資料更新時間</span><strong id="updated">-</strong></div><div class="stat panel"><span>盤中資料最近更新</span><strong id="intradayUpdated">-</strong></div><div class="stat panel"><span>剩餘年期基準日</span><strong id="asof">-</strong></div><div class="stat panel"><span>成交明細</span><strong id="records">-</strong></div><div class="stat panel"><span>成功讀取利率</span><strong id="yieldRecords">-</strong></div><div class="stat panel"><span>未 Mapping</span><strong id="unmappedCount">-</strong></div></section><section class="toolbar panel"><label>顯示期間<select id="range"><option value="20">最近20交易日</option><option value="40">最近40交易日</option><option value="60">最近60交易日</option><option value="custom">自訂日期區間</option><option value="all">全部日期</option></select></label><div id="customDates" class="custom"><label>起日<input id="startDate" type="date"></label><label>迄日<input id="endDate" type="date"></label><button id="applyDate" class="button primary">套用</button></div><label>搜尋<input id="search" type="search" placeholder="券號、名稱、發行人"></label><label class="check-label"><input id="activeOnly" type="checkbox">只顯示有即時報價或今日成交</label><div class="today-trades"><strong>今日成交</strong><div id="todayTrades" class="today-list"><span class="empty">尚無資料</span></div></div></section><div id="message" class="notice hidden"></div><div id="root"><div class="loading">載入資料中…</div></div><section class="unmapped panel"><div class="unmapped-head"><div><h2>尚未 Mapping</h2><p>下載Excel後，A欄券號已填妥。B欄到期日為唯一必填，格式固定為 YYYY-MM-DD。</p></div><div><button id="downloadExcel" class="button secondary">下載未 Mapping Excel</button> <button id="uploadExcelBtn" class="button primary">上傳已填 Excel</button><input id="uploadExcel" class="file" type="file" accept=".xlsx,.xls"></div></div><div id="unmappedList" class="unmapped-list"></div><div class="mapping"><div class="box"><h3>單檔補 Mapping</h3><form id="singleForm" class="form"><label>券號<input id="singleCode" required maxlength="12"></label><label>到期日<input id="singleMaturity" required type="date"></label><label>債券名稱<input id="singleName"></label><label>發行人<input id="singleIssuer"></label><label>債券類型<input id="singleType"></label><label>發行日<input id="singleIssue" type="date"></label><label>票面利率（%）<input id="singleCoupon" type="number" step="0.0001"></label><label>幣別<input id="singleCurrency"></label><label class="full">備註<input id="singleNote"></label><button class="button primary full" type="submit">送出並套用</button></form><button id="downloadJson" class="button secondary">下載完整 Mapping JSON</button> <button id="clearAllManual" class="button danger">一鍵清空目前人工 Mapping</button> <button id="clearLocal" class="button danger">清除瀏覽器暫存並重讀 Repo</button></div><div class="box"><h3>目前人工 Mapping</h3><div id="mappingCurrent" class="current"></div></div></div></section></main><dialog id="detail"><div class="dlg-head"><h2 id="detailTitle">成交明細</h2><button id="closeDetail" class="close">×</button></div><div id="detailBody" class="dlg-body"></div></dialog><dialog id="quoteHistory"><div class="dlg-head"><h2 id="quoteHistoryTitle">公債歷史報價</h2><button id="closeQuoteHistory" class="close">×</button></div><div id="quoteHistoryBody" class="dlg-body"></div></dialog><script>
'use strict';
const DATA_URL='data/merged_outright.json',MASTER_URL='data/bond_master.json',MANUAL_URL='data/manual_bond_mapping.json',INTRADAY_URL='data/intraday/intraday_market.json',QUOTE_HISTORY_URL='data/intraday/government_quote_history.json',LOCAL_KEY='twBondManualMapping',BENCHMARK_KEY='twBondBenchmarkGovernmentBonds';

const TERMS=[{key:'1Y',label:'1年',min:.5,max:1.5},{key:'2Y',label:'2~3年',min:1.5,max:4},{key:'5Y',label:'5年',min:4,max:6},{key:'7Y',label:'7年',min:6,max:8},{key:'10Y',label:'10年',min:8,max:12},{key:'20Y',label:'20年',min:15,max:25},{key:'30Y',label:'30年',min:25,max:35}];
const ORDER=['台積電','台電','鴻海','富邦人壽','中油','中國輸出','中鋼','凱基人壽','元大證券','台北富邦','元大銀行','南山人壽','日月光投控','凱基證券','富邦金','中信銀','和潤企業','中租迪和'];
let data={metadata:{},dates:{}},master={metadata:{},bonds:{}},manual={metadata:{},bonds:{}},intraday={metadata:{},government_quote:{rows:[]},government_trade:{rows:[]},company_trade:{rows:[]}},quoteHistory={metadata:{},dates:{}},selectedDates=[],unmapped=new Map(),benchmarkBonds=loadBenchmarkBonds();
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(typeof v==='number'&&Number.isFinite(v))return v;const n=Number(String(v??'').replace(/[%％,]/g,'').trim());return Number.isFinite(n)?n:null};
function loadBenchmarkBonds(){try{const raw=JSON.parse(localStorage.getItem(BENCHMARK_KEY)||'[]');return new Set(Array.isArray(raw)?raw.map(v=>String(v).trim().toUpperCase()).filter(Boolean):[])}catch{return new Set()}}

function benchmarkControl(code){const c=String(code||'').trim().toUpperCase(),checked=isBenchmarkBond(c)?' checked':'';return `<label class="benchmark-check" title="勾選為指標公債"><input type="checkbox" data-benchmark="${esc(c)}"${checked}>指標債</label>`}
function bindBenchmarkControls(){document.querySelectorAll('[data-benchmark]').forEach(input=>{input.onchange=()=>{const code=String(input.dataset.benchmark||'').toUpperCase();if(input.checked)benchmarkBonds.add(code);else benchmarkBonds.delete(code);saveBenchmarkBonds();render()}})}
function normalizeManual(p){const b=p?.bonds&&typeof p.bonds==='object'?p.bonds:{};return{metadata:{description:'人工補充債券主檔',...(p?.metadata||{})},bonds:Object.fromEntries(Object.entries(b).map(([k,v])=>[k.trim().toUpperCase(),{...v,bond_code:k.trim().toUpperCase()}]))}}
async function readJson(url,opt=false){const r=await fetch(`${url}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok){if(opt&&r.status===404)return null;throw Error(`${url} HTTP ${r.status}`)}return r.json()}
async function load(){show('',false);$('root').innerHTML='<div class="loading">載入資料中…</div>';try{const[d,bm,m,i,h]=await Promise.all([readJson(DATA_URL),readJson(MASTER_URL,true),readJson(MANUAL_URL,true),readJson(INTRADAY_URL,true),readJson(QUOTE_HISTORY_URL,true)]);data=d;master=bm||master;intraday=i||intraday;quoteHistory=h||quoteHistory;const repoManual=normalizeManual(m||{}),localText=localStorage.getItem(LOCAL_KEY),localManual=localText?normalizeManual(JSON.parse(localText)):normalizeManual({});manual=normalizeManual({metadata:{...repoManual.metadata,...localManual.metadata},bonds:{...repoManual.bonds,...localManual.bonds}});render()}catch(e){show(`資料載入失敗：${e.message}`,true);$('root').innerHTML=''}}
function show(t,error){$('message').textContent=t;$('message').className='notice'+(error?' error':'')+(t?'':' hidden')}
function dObj(s){const d=new Date(`${String(s||'').slice(0,10)}T00:00:00`);return isNaN(d)?null:d}
function yearsTo(maturity,asof){const m=dObj(maturity),a=dObj(asof);return m&&a?Math.round(((m-a)/86400000/365.25)*10)/10:null}
function manualRec(code){code=String(code||'').toUpperCase();return manual.bonds[code]||manual.bonds[code.replace(/R$/,'')]||null}
function masterRec(code){code=String(code||'').trim().toUpperCase();const bonds=master?.bonds||{},base=code.replace(/R$/,'');if(bonds[code])return bonds[code];if(bonds[base])return bonds[base];for(const[masterCode,record]of Object.entries(bonds)){if(String(record?.base_bond_code||masterCode).trim().toUpperCase().replace(/R$/,'')===base)return record}return null}
function quoteYears(code,tradeDate){const manualRow=manualRec(code),masterRow=masterRec(code),row=manualRow||masterRow;if(!row)return null;if(row.maturity_date)return yearsTo(row.maturity_date,tradeDate||taipeiToday());return num(row.latest_remaining_years)}
function years(r){const code=String(r?.bond_code||'').trim().toUpperCase(),m=manualRec(code),mr=masterRec(code),asof=data.metadata?.remaining_years_as_of||intraday.metadata?.trade_date||taipeiToday();if(m?.maturity_date)return yearsTo(m.maturity_date,asof);if(mr?.maturity_date)return yearsTo(mr.maturity_date,asof);if(r?.maturity_date)return yearsTo(r.maturity_date,asof);return num(r?.latest_remaining_years)??num(r?.remaining_years)}
function bucket(y){return TERMS.find(t=>y>=t.min&&y<t.max)||null}
function fDate(s){const[y,m,d]=String(s).split('-');return `${y}/${Number(m)}/${Number(d)}`}
function allEntries(o,p=''){let out=[];for(const[k,v]of Object.entries(o||{})){const path=p?`${p}.${k}`:k;if(v&&typeof v==='object'&&!Array.isArray(v))out=out.concat(allEntries(v,path));else out.push([path,v])}return out}
function exactRate(r){const market=String(r.market||'').toUpperCase();const wanted=market==='EBTS'?'平均 Volume-Weighted Average':'加權平均Volume-Weighted Average';
  // 先直接讀JSON頂層的精確欄名。
  if(Object.prototype.hasOwnProperty.call(r,wanted)&&num(r[wanted])!=null)return{value:num(r[wanted]),field:wanted};
  // 若資料位於巢狀物件，仍只接受完全相同欄名；若重複欄位變成 _2/_3，取最後一個。
  const hits=allEntries(r).filter(([path,v])=>{const k=path.split('.').pop();return(k===wanted||new RegExp('^'+wanted.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'_\\d+$').test(k))&&num(v)!=null});
